seed: 42
model:
  id: Qwen/Qwen2.5-0.5B-Instruct
dataset:
  name: openai/gsm8k
  validation_fraction: 0.1
curriculum:
  enabled: true
  max_stage: 4
  stages:
    1: simple_arithmetic
    2: one_step_word_problem
    3: fractions_percent_equations
    4: multi_step_reasoning
sft:
  output_dir: outputs/sft-adapter
  run_name: reasonforge-qwen-0.5b-sft
  train_size: 1024
  validation_size: 128
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4
  max_length: 512
  learning_rate: 2.0e-05
  max_steps: 100
  warmup_ratio: 0.05
  max_grad_norm: 0.5
  logging_steps: 1
  eval_steps: 25
  save_steps: 25
  save_total_limit: 2
  gradient_checkpointing: true
  optimizer: adamw_torch
  report_to: none
smoke:
  output_dir: outputs/sft-smoke-adapter
  run_name: reasonforge-sft-smoke
  train_size: 32
  validation_size: 8
  max_steps: 4
  eval_steps: 4
  save_steps: 4
lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
